[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-dashboards"
version = "0.1.0"
description = "Stage 1 evidence-grounded OULAD dashboard feasibility prototype"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3",
  "statsmodels==0.14.5", "duckdb==1.3.2", "pyarrow==20.0.0",
  "pydantic==2.11.7", "altair==5.5.0", "vl-convert-python==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
gpu = ["transformers==4.55.2", "accelerate==1.10.1", "huggingface-hub==0.34.4"]

[project.scripts]
trajectory = "trajectory_dashboards.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
